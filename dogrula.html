<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Turnuva &amp; Fikstür</title>
  <style>
    body { font: 16px/1.55 system-ui, sans-serif; color: #0f172a; background: #f8fafc; margin: 0; }
    main { max-width: 440px; margin: 0 auto; padding: 56px 20px; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 10px; background: #14432e; color: #fde68a; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #475569; margin: 0 0 14px; }
    a.button { display: block; margin: 26px 0 12px; padding: 14px; border-radius: 8px; background: #15803d; color: #fff; font-weight: 700; text-decoration: none; }
    .note { font-size: 13px; color: #64748b; }
    .error h1 { color: #b91c1c; }
  </style>
</head>
<body>
  <main id="page">
    <div class="mark">T</div>
    <h1 id="title">Bağlantı doğrulandı</h1>
    <p id="text">Devam etmek için uygulamayı aç.</p>
    <a class="button" id="open" href="#">Uygulamada aç</a>
    <p class="note" id="note">Kaydı bu telefonda yaptıysan uygulama açılınca giriş yapılır. Başka bir cihazda yaptıysan e-postan doğrulandı; uygulamada şifrenle giriş yapabilirsin.</p>
  </main>
  <script>
    // E-postadaki bağlantı Supabase'de doğrulandıktan sonra buraya gelir. Uygulama
    // yüklüyse Android bu adresi doğrudan uygulamada açar; açmazsa düğme açar.
    const query = window.location.search;
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const params = new URLSearchParams(query);
    const error = params.get('error_code') || hash.get('error_code') || params.get('error') || hash.get('error');
    const page = document.getElementById('page');
    if (error) {
      page.classList.add('error');
      document.getElementById('title').textContent = 'Bağlantı geçersiz';
      document.getElementById('text').textContent = 'Bağlantının süresi dolmuş veya daha önce kullanılmış. Uygulamadan yeni bir bağlantı iste.';
    }
    // Android intent adresinde '#' kullanılamaz; tüm parametreler sorguya taşınır.
    const all = new URLSearchParams(query);
    hash.forEach((value, key) => all.set(key, value));
    const target = 'login-callback' + (all.toString() ? '?' + all.toString() : '');
    const android = /Android/i.test(navigator.userAgent);
    const link = android
      ? 'intent://' + target + '#Intent;scheme=com.turnuvafikstur.app;package=com.turnuvafikstur.app;end'
      : 'com.turnuvafikstur.app://' + target;
    document.getElementById('open').href = link;
    if (error) document.getElementById('open').textContent = 'Uygulamayı aç';
  </script>
</body>
</html>
